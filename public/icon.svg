<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d09"/>
      <stop offset="50%" stop-color="#02140e"/>
      <stop offset="100%" stop-color="#010805"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Dark OLED -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Radar / Convoy Waves (Eco-Futuristic Pulse) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.15" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f59b" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Futuristic Sync Motorcycle / Wing Path -->
  <g filter="url(#glow)">
    <!-- Central GPS Hub Pin -->
    <path d="M256 100 C190 100 136 154 136 220 C136 300 240 395 251 405 C254 408 258 408 261 405 C272 395 376 300 376 220 C376 154 322 100 256 100 Z" 
          fill="none" stroke="url(#neonGreen)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Cyber Core -->
    <circle cx="256" cy="216" r="42" fill="url(#neonGreen)"/>
    
    <!-- Futuristic Aerodynamic Speed Chevrons (Motorcycle Visor / Wing) -->
    <path d="M185 240 L256 310 L327 240" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M205 285 L256 335 L307 285" fill="none" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eco Leaf / Sync Satellite Dot -->
  <circle cx="256" cy="216" r="16" fill="#02140e"/>
  <circle cx="370" cy="140" r="14" fill="#00f59b" filter="url(#glow)"/>
</svg>
